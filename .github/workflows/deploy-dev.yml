# .github/workflows/deploy-dev.yml
# Generated by Terraform - DO NOT EDIT MANUALLY
# This workflow deploys to Cloud Run using dynamic configuration from Secret Manager
# NO hardcoded project IDs or secrets - all configuration retrieved at runtime

name: Deploy to Cloud Run (dev)

on:
  push:
    branches:
      - develop
      - empty-change # This is the current branch. This is temporary.
    paths:
      - "apps/**"
      - "packages/**"
      - "apps/app/Dockerfile"
      - ".dockerignore"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Container image tag (default: commit SHA)"
        required: false
        type: string

# Concurrency: Cancel in-progress deployments for the same environment
concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write  # Required for Workload Identity Federation

jobs:
  # ============================================================================
  # Job 1: Retrieve Configuration from Secret Manager
  # ============================================================================
  # This job authenticates via WIF and retrieves deployment configuration
  # All project IDs, regions, and settings come from Secret Manager (NO hardcoded values)

  retrieve-config:
    name: Retrieve Deployment Configuration
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      project_id: ${{ steps.config.outputs.project_id }}
      project_number: ${{ steps.config.outputs.project_number }}
      region: ${{ steps.config.outputs.region }}
      service_name: ${{ steps.config.outputs.service_name }}
      artifact_registry_url: ${{ steps.config.outputs.artifact_registry_url }}
      min_instances: ${{ steps.config.outputs.min_instances }}
      max_instances: ${{ steps.config.outputs.max_instances }}
      memory: ${{ steps.config.outputs.memory }}
      cpu: ${{ steps.config.outputs.cpu }}
      timeout_seconds: ${{ steps.config.outputs.timeout_seconds }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2.1.7
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2.1.2
        with:
          version: "503.0.0"

      - name: Retrieve Deployment Configuration
        id: config
        run: |
          set -euo pipefail
          
          # Retrieve secret from Secret Manager
          SECRET_NAME="github-deployment-config-dev"
          echo "📦 Retrieving deployment configuration from Secret Manager: $SECRET_NAME"
          
          CONFIG_JSON=$(gcloud secrets versions access latest \
            --secret="$SECRET_NAME" \
            --project="$(gcloud config get-value project)" \
            --format="json")
          
          # Validate JSON
          if ! echo "$CONFIG_JSON" | jq empty 2>/dev/null; then
            echo "❌ Error: Invalid JSON in deployment configuration"
            exit 1
          fi
          
          # Extract and validate configuration values
          PROJECT_ID_VAL=$(echo "$CONFIG_JSON" | jq -r '.project_id // empty')
          REGION_VAL=$(echo "$CONFIG_JSON" | jq -r '.region // empty')
          ARTIFACT_REGISTRY_URL_VAL=$(echo "$CONFIG_JSON" | jq -r '.artifact_registry_url // empty')
          
          if [ -z "$PROJECT_ID_VAL" ] || [ -z "$REGION_VAL" ] || [ -z "$ARTIFACT_REGISTRY_URL_VAL" ]; then
            echo "❌ Error: Missing required configuration values"
            echo "   project_id: ${PROJECT_ID_VAL:-MISSING}"
            echo "   region: ${REGION_VAL:-MISSING}"
            echo "   artifact_registry_url: ${ARTIFACT_REGISTRY_URL_VAL:-MISSING}"
            exit 1
          fi
          
          # Extract configuration values
          echo "project_id=$PROJECT_ID_VAL" >> $GITHUB_OUTPUT
          echo "project_number=$(echo "$CONFIG_JSON" | jq -r '.project_number // ""')" >> $GITHUB_OUTPUT
          echo "region=$REGION_VAL" >> $GITHUB_OUTPUT
          echo "service_name=$(echo "$CONFIG_JSON" | jq -r '.service_name // ""')" >> $GITHUB_OUTPUT
          echo "artifact_registry_url=$ARTIFACT_REGISTRY_URL_VAL" >> $GITHUB_OUTPUT
          echo "min_instances=$(echo "$CONFIG_JSON" | jq -r '.cloudrun_config.min_instances // 0')" >> $GITHUB_OUTPUT
          echo "max_instances=$(echo "$CONFIG_JSON" | jq -r '.cloudrun_config.max_instances // 2')" >> $GITHUB_OUTPUT
          echo "memory=$(echo "$CONFIG_JSON" | jq -r '.cloudrun_config.memory // "256Mi"')" >> $GITHUB_OUTPUT
          echo "cpu=$(echo "$CONFIG_JSON" | jq -r '.cloudrun_config.cpu // "1"')" >> $GITHUB_OUTPUT
          echo "timeout_seconds=$(echo "$CONFIG_JSON" | jq -r '.cloudrun_config.timeout_seconds // 300')" >> $GITHUB_OUTPUT
          
          # Display configuration (non-sensitive)
          echo "✅ Configuration retrieved successfully"
          echo "   Project: $PROJECT_ID_VAL"
          echo "   Region: $REGION_VAL"
          echo "   Service: $(echo "$CONFIG_JSON" | jq -r '.service_name // "N/A"')"
          echo "   Artifact Registry: $ARTIFACT_REGISTRY_URL_VAL"

  # ============================================================================
  # Job 2: Build and Push Container Image
  # ============================================================================

  build-and-push:
    name: Build and Push Container
    runs-on: ubuntu-latest
    needs: retrieve-config
    outputs:
      image_url: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2.1.7
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2.1.2
        with:
          version: "503.0.0"

      - name: Configure Docker for Artifact Registry
        run: |
          REGION="${{ needs.retrieve-config.outputs.region }}"
          PROJECT_ID="${{ needs.retrieve-config.outputs.project_id }}"
          echo "🔐 Configuring Docker for Artifact Registry in region: $${REGION}"
          gcloud auth configure-docker $${REGION}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.7.1

      - name: Generate image metadata
        id: meta
        run: |
          set -euo pipefail
          
          PROJECT_ID="${{ needs.retrieve-config.outputs.project_id }}"
          REGION="${{ needs.retrieve-config.outputs.region }}"
          ARTIFACT_REGISTRY_URL="${{ needs.retrieve-config.outputs.artifact_registry_url }}"
          IMAGE_TAG="${{ github.event.inputs.image_tag || github.sha }}"
          
          # Validate artifact_registry_url
          if [ -z "$${ARTIFACT_REGISTRY_URL}" ]; then
            echo "❌ Error: artifact_registry_url is empty"
            echo "   Project ID: $${PROJECT_ID}"
            echo "   Region: $${REGION}"
            exit 1
          fi
          
          # Construct full image URL: <region>-docker.pkg.dev/<project-id>/<repo-id>/<image-name>:<tag>
          IMAGE_URL="$${ARTIFACT_REGISTRY_URL}/app:$${IMAGE_TAG}"
          
          # Validate image URL format
          if [[ ! "$${IMAGE_URL}" =~ ^[a-z0-9-]+-docker\.pkg\.dev/[a-z0-9-]+/[a-z0-9-]+/app: ]]; then
            echo "❌ Error: Invalid image URL format: $${IMAGE_URL}"
            echo "   Expected format: <region>-docker.pkg.dev/<project-id>/<repo-id>/app:<tag>"
            exit 1
          fi
          
          echo "tags=$${IMAGE_URL}" >> $GITHUB_OUTPUT
          echo "📦 Image URL: $${IMAGE_URL}"
          echo "   Project: $${PROJECT_ID}"
          echo "   Region: $${REGION}"
          echo "   Tag: $${IMAGE_TAG}"

      - name: Build and Push Container
        id: build
        uses: docker/build-push-action@v6.10.0
        with:
          context: .
          file: ./apps/app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image Summary
        run: |
          echo "### 🐳 Container Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image URL**: \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest**: \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: \`${{ github.event.inputs.image_tag || github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Job 3: Deploy to Cloud Run
  # ============================================================================

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    environment: dev
    needs: [retrieve-config, build-and-push]
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2.1.7
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2.1.2
        with:
          version: "503.0.0"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2.7.2
        with:
          service: ${{ needs.retrieve-config.outputs.service_name }}
          region: ${{ needs.retrieve-config.outputs.region }}
          image: ${{ needs.build-and-push.outputs.image_url }}
          flags: |
            --min-instances=${{ needs.retrieve-config.outputs.min_instances }}
            --max-instances=${{ needs.retrieve-config.outputs.max_instances }}
            --memory=${{ needs.retrieve-config.outputs.memory }}
            --cpu=${{ needs.retrieve-config.outputs.cpu }}
            --timeout=${{ needs.retrieve-config.outputs.timeout_seconds }}
            --cpu-boost
            --allow-unauthenticated

      - name: Get Service URL
        id: service
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ needs.retrieve-config.outputs.service_name }} \
            --region=${{ needs.retrieve-config.outputs.region }} \
            --project=${{ needs.retrieve-config.outputs.project_id }} \
            --format="value(status.url)")
          echo "url=$$${SERVICE_URL}" >> $GITHUB_OUTPUT
          echo "✅ Service URL: $$${SERVICE_URL}"

      - name: Deployment Summary
        run: |
          echo "### 🚀 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: \`dev\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: \`${{ needs.retrieve-config.outputs.service_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: \`${{ needs.retrieve-config.outputs.region }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ needs.build-and-push.outputs.image_url }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Service URL**: [${{ steps.service.outputs.url }}](${{ steps.service.outputs.url }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Min Instances**: \`${{ needs.retrieve-config.outputs.min_instances }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Max Instances**: \`${{ needs.retrieve-config.outputs.max_instances }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Memory**: \`${{ needs.retrieve-config.outputs.memory }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **CPU**: \`${{ needs.retrieve-config.outputs.cpu }}\`" >> $GITHUB_STEP_SUMMARY
