name: Deploy (develop/staging/main → GCP)

on:
  push:
    # Branch → environment mapping:
    # - develop → dev
    # - staging → staging
    # - main → production
    branches: ["main", "develop", "staging"]
    paths:
      - "apps/**"
      - "packages/**"
      - "Dockerfile*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy.yml"

concurrency:
  # Serializes production deployments; latest push wins.
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Required for GitHub → GCP OIDC federation (NO long-lived secrets).
  id-token: write

env:
  # Shared region across environments (override here if needed).
  GCP_REGION: us-central1

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      auth_app: ${{ steps.filter.outputs.auth_app }}
      auth_api: ${{ steps.filter.outputs.auth_api }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - "apps/app/**"
              - "packages/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "apps/app/Dockerfile"
            auth_app:
              - "apps/auth-app/**"
              - "packages/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "apps/auth-app/Dockerfile"
            auth_api:
              - "apps/auth-api/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "apps/auth-api/Dockerfile"

  env-select:
    name: Select environment config (dev / staging / prod)
    runs-on: ubuntu-latest
    outputs:
      gcp_project_id: ${{ steps.set-env.outputs.gcp_project_id }}
      ar_repository: ${{ steps.set-env.outputs.ar_repository }}
      cloud_run_service_app: ${{ steps.set-env.outputs.cloud_run_service_app }}
      cloud_run_service_auth_app: ${{ steps.set-env.outputs.cloud_run_service_auth_app }}
      cloud_run_service_auth_api: ${{ steps.set-env.outputs.cloud_run_service_auth_api }}
      wif_provider: ${{ steps.set-env.outputs.wif_provider }}
      wif_service_account: ${{ steps.set-env.outputs.wif_service_account }}
      github_environment: ${{ steps.set-env.outputs.github_environment }}
      # Firebase Web SDK config (per environment)
      vite_firebase_api_key: ${{ steps.set-env.outputs.vite_firebase_api_key }}
      vite_firebase_auth_domain: ${{ steps.set-env.outputs.vite_firebase_auth_domain }}
      vite_firebase_project_id: ${{ steps.set-env.outputs.vite_firebase_project_id }}
      vite_firebase_storage_bucket: ${{ steps.set-env.outputs.vite_firebase_storage_bucket }}
      vite_firebase_messaging_sender_id: ${{ steps.set-env.outputs.vite_firebase_messaging_sender_id }}
      vite_firebase_app_id: ${{ steps.set-env.outputs.vite_firebase_app_id }}
      vite_firebase_measurement_id: ${{ steps.set-env.outputs.vite_firebase_measurement_id }}
    steps:
      - name: Determine branch environment
        id: set-env
        run: |
          echo "Detected ref: ${{ github.ref }} (name: ${{ github.ref_name }})"

          # <<TERRAFORM_VALUES_START>>
          # This section is auto-generated by iaac/scripts/generate-workflow-config.sh
          # Do not edit manually - run the script to update these values from Terraform outputs
          if [ "${{ github.ref_name }}" = "develop" ]; then
            # --- Development environment (GCP dev project) ---
            echo "gcp_project_id=dev-rates-01" >> "$GITHUB_OUTPUT"
            echo "ar_repository=dev-rates" >> "$GITHUB_OUTPUT"
            echo "cloud_run_service_app=rates-app-dev" >> "$GITHUB_OUTPUT"
            echo "cloud_run_service_auth_app=rates-auth-app-dev" >> "$GITHUB_OUTPUT"
            echo "cloud_run_service_auth_api=rates-auth-api-dev" >> "$GITHUB_OUTPUT"
            echo "wif_provider=projects/116876566424/locations/global/workloadIdentityPools/github-pool/providers/github-provider" >> "$GITHUB_OUTPUT"
            echo "wif_service_account=github-ci-dev@dev-rates-01.iam.gserviceaccount.com" >> "$GITHUB_OUTPUT"
            echo "github_environment=development" >> "$GITHUB_OUTPUT"
            # Firebase Web SDK config (from .iaac.env)
            echo "vite_firebase_api_key=AIzaSyBt3UuP69pYFCfdJsmkmJmx4O_bL9jGVBc" >> "$GITHUB_OUTPUT"
            echo "vite_firebase_auth_domain=dev-rates-01-5a9aa.firebaseapp.com" >> "$GITHUB_OUTPUT"
            echo "vite_firebase_project_id=dev-rates-01-5a9aa" >> "$GITHUB_OUTPUT"
            echo "vite_firebase_storage_bucket=dev-rates-01-5a9aa.appspot.com" >> "$GITHUB_OUTPUT"
            echo "vite_firebase_messaging_sender_id=368101248577" >> "$GITHUB_OUTPUT"
            echo "vite_firebase_app_id=1:368101248577:web:c487c70ef308546b3d00c0" >> "$GITHUB_OUTPUT"
            echo "vite_firebase_measurement_id=" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            # --- Staging environment (GCP staging project) ---
            echo "gcp_project_id=staging-rates-01" >> "$GITHUB_OUTPUT"
            echo "ar_repository=staging-rates" >> "$GITHUB_OUTPUT"
            echo "cloud_run_service_app=rates-app-staging" >> "$GITHUB_OUTPUT"
            echo "cloud_run_service_auth_app=rates-auth-app-staging" >> "$GITHUB_OUTPUT"
            echo "cloud_run_service_auth_api=rates-auth-api-staging" >> "$GITHUB_OUTPUT"
            echo "wif_provider=projects/121459611937/locations/global/workloadIdentityPools/github-pool/providers/github-provider" >> "$GITHUB_OUTPUT"
            echo "wif_service_account=github-ci-staging@staging-rates-01.iam.gserviceaccount.com" >> "$GITHUB_OUTPUT"
            echo "github_environment=staging" >> "$GITHUB_OUTPUT"
            # Firebase Web SDK config (from .iaac.env)
            echo "vite_firebase_api_key=" >> "$GITHUB_OUTPUT"
            echo "vite_firebase_auth_domain=" >> "$GITHUB_OUTPUT"
            echo "vite_firebase_project_id=" >> "$GITHUB_OUTPUT"
            echo "vite_firebase_storage_bucket=" >> "$GITHUB_OUTPUT"
            echo "vite_firebase_messaging_sender_id=" >> "$GITHUB_OUTPUT"
            echo "vite_firebase_app_id=" >> "$GITHUB_OUTPUT"
            echo "vite_firebase_measurement_id=" >> "$GITHUB_OUTPUT"
          else
            # --- Production (main) ---
            echo "gcp_project_id=prod-rates-01" >> "$GITHUB_OUTPUT"
            echo "ar_repository=rates" >> "$GITHUB_OUTPUT"
            echo "cloud_run_service_app=rates-app" >> "$GITHUB_OUTPUT"
            echo "cloud_run_service_auth_app=rates-auth-app" >> "$GITHUB_OUTPUT"
            echo "cloud_run_service_auth_api=rates-auth-api" >> "$GITHUB_OUTPUT"
            echo "wif_provider=projects/568545658944/locations/global/workloadIdentityPools/github-pool/providers/github-provider" >> "$GITHUB_OUTPUT"
            echo "wif_service_account=github-ci-prod@prod-rates-01.iam.gserviceaccount.com" >> "$GITHUB_OUTPUT"
            echo "github_environment=production" >> "$GITHUB_OUTPUT"
            # Firebase Web SDK config (from .iaac.env)
            echo "vite_firebase_api_key=" >> "$GITHUB_OUTPUT"
            echo "vite_firebase_auth_domain=" >> "$GITHUB_OUTPUT"
            echo "vite_firebase_project_id=" >> "$GITHUB_OUTPUT"
            echo "vite_firebase_storage_bucket=" >> "$GITHUB_OUTPUT"
            echo "vite_firebase_messaging_sender_id=" >> "$GITHUB_OUTPUT"
            echo "vite_firebase_app_id=" >> "$GITHUB_OUTPUT"
            echo "vite_firebase_measurement_id=" >> "$GITHUB_OUTPUT"
          fi
          # <<TERRAFORM_VALUES_END>>

  deploy:
    name: Build → push → deploy (Cloud Run)
    runs-on: ubuntu-latest
    needs: [changes, env-select]
    # GitHub Environment gives you: required reviewers, audit trail, protected secrets.
    environment: ${{ needs.env-select.outputs.github_environment }}
    env:
      GCP_PROJECT_ID: ${{ needs.env-select.outputs.gcp_project_id }}
      AR_REPOSITORY: ${{ needs.env-select.outputs.ar_repository }}
      CLOUD_RUN_SERVICE_APP: ${{ needs.env-select.outputs.cloud_run_service_app }}
      CLOUD_RUN_SERVICE_AUTH_APP: ${{ needs.env-select.outputs.cloud_run_service_auth_app }}
      CLOUD_RUN_SERVICE_AUTH_API: ${{ needs.env-select.outputs.cloud_run_service_auth_api }}
      WIF_PROVIDER: ${{ needs.env-select.outputs.wif_provider }}
      WIF_SERVICE_ACCOUNT: ${{ needs.env-select.outputs.wif_service_account }}
      # Firebase Web SDK config (from env-select step)
      VITE_FIREBASE_API_KEY: ${{ needs.env-select.outputs.vite_firebase_api_key }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ needs.env-select.outputs.vite_firebase_auth_domain }}
      VITE_FIREBASE_PROJECT_ID: ${{ needs.env-select.outputs.vite_firebase_project_id }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ needs.env-select.outputs.vite_firebase_storage_bucket }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ needs.env-select.outputs.vite_firebase_messaging_sender_id }}
      VITE_FIREBASE_APP_ID: ${{ needs.env-select.outputs.vite_firebase_app_id }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ needs.env-select.outputs.vite_firebase_measurement_id }}
      # Nonce secret (from GitHub Environment secrets - set manually once)
      # Note: This should match the value in your .iaac.env file
      VITE_NONCE_SECRET: ${{ secrets.NONCE_SECRET }}
      # Cookie config (optional, defaults shown)
      VITE_ENABLE_AUTH_COOKIE: ${{ vars.VITE_ENABLE_AUTH_COOKIE || 'true' }}
      VITE_AUTH_COOKIE_NAME: ${{ vars.VITE_AUTH_COOKIE_NAME || 'auth_app_token' }}
      VITE_AUTH_COOKIE_MAX_AGE: ${{ vars.VITE_AUTH_COOKIE_MAX_AGE || '3600' }}
      VITE_AUTH_COOKIE_DOMAIN: ${{ vars.VITE_AUTH_COOKIE_DOMAIN || '' }}
      VITE_AUTH_COOKIE_SAMESITE: ${{ vars.VITE_AUTH_COOKIE_SAMESITE || 'Lax' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: app
            enabled: ${{ needs.changes.outputs.app == 'true' }}
            dockerfile: apps/app/Dockerfile
            image_name: rates-app
            cloud_run_service: ${{ needs.env-select.outputs.cloud_run_service_app }}
          - id: auth-app
            enabled: ${{ needs.changes.outputs.auth_app == 'true' }}
            dockerfile: apps/auth-app/Dockerfile
            image_name: rates-auth-app
            cloud_run_service: ${{ needs.env-select.outputs.cloud_run_service_auth_app }}
          - id: auth-api
            enabled: ${{ needs.changes.outputs.auth_api == 'true' }}
            dockerfile: apps/auth-api/Dockerfile
            image_name: rates-auth-api
            cloud_run_service: ${{ needs.env-select.outputs.cloud_run_service_auth_api }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC → WIF)
        if: matrix.enabled
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        if: matrix.enabled
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Resolve Cloud Run service URLs (for Vite build-time env)
        if: matrix.enabled
        id: service-urls
        run: |
          APP_URL="$(gcloud run services describe "${CLOUD_RUN_SERVICE_APP}" --region "${GCP_REGION}" --format='value(status.url)')"
          AUTH_URL="$(gcloud run services describe "${CLOUD_RUN_SERVICE_AUTH_APP}" --region "${GCP_REGION}" --format='value(status.url)')"
          AUTH_API_URL="$(gcloud run services describe "${CLOUD_RUN_SERVICE_AUTH_API}" --region "${GCP_REGION}" --format='value(status.url)')"
          echo "app_url=${APP_URL}" >> "$GITHUB_OUTPUT"
          echo "auth_url=${AUTH_URL}" >> "$GITHUB_OUTPUT"
          echo "auth_api_url=${AUTH_API_URL}" >> "$GITHUB_OUTPUT"

      - name: Configure Docker auth for Artifact Registry
        if: matrix.enabled
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Setup Docker Buildx
        if: matrix.enabled
        uses: docker/setup-buildx-action@v3

      - name: Build & push image (tag = github.sha)
        if: matrix.enabled
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            # Service URLs (resolved from Cloud Run)
            VITE_AUTH_APP_URL=${{ steps.service-urls.outputs.auth_url }}
            VITE_AUTH_API_URL=${{ steps.service-urls.outputs.auth_api_url }}
            VITE_ALLOWED_REDIRECTS=${{ steps.service-urls.outputs.app_url }}
            VITE_DEFAULT_RETURN_URL=${{ steps.service-urls.outputs.app_url }}
            # Firebase Web SDK config (from GitHub Environment secrets/variables)
            VITE_FIREBASE_API_KEY=${{ env.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ env.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ env.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ env.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ env.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ env.VITE_FIREBASE_APP_ID }}
            VITE_FIREBASE_MEASUREMENT_ID=${{ env.VITE_FIREBASE_MEASUREMENT_ID }}
            # Production mode flags
            VITE_USE_FIREBASE_EMULATOR=false
            VITE_FIREBASE_MODE=live
            # Nonce secret (shared between apps)
            VITE_NONCE_SECRET=${{ env.VITE_NONCE_SECRET }}
            # Auth-app cookie config (only for auth-app builds)
            VITE_ENABLE_AUTH_COOKIE=${{ env.VITE_ENABLE_AUTH_COOKIE || 'true' }}
            VITE_AUTH_COOKIE_NAME=${{ env.VITE_AUTH_COOKIE_NAME || 'auth_app_token' }}
            VITE_AUTH_COOKIE_MAX_AGE=${{ env.VITE_AUTH_COOKIE_MAX_AGE || '3600' }}
            VITE_AUTH_COOKIE_DOMAIN=${{ env.VITE_AUTH_COOKIE_DOMAIN || '' }}
            VITE_AUTH_COOKIE_SAMESITE=${{ env.VITE_AUTH_COOKIE_SAMESITE || 'Lax' }}
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ matrix.image_name }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        if: matrix.enabled
        run: |
          # Auth API needs runtime env vars for CORS + project id (it is a real backend).
          EXTRA_FLAGS=""
          if [ "${{ matrix.id }}" = "auth-api" ]; then
            EXTRA_FLAGS="--set-env-vars=ALLOWED_ORIGINS=${{ steps.service-urls.outputs.app_url }},FIREBASE_PROJECT_ID=${{ env.VITE_FIREBASE_PROJECT_ID }}"
          fi

          gcloud run deploy "${{ matrix.cloud_run_service }}" \
            --region "${{ env.GCP_REGION }}" \
            --image "${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ matrix.image_name }}:${{ github.sha }}" \
            --platform managed \
            ${EXTRA_FLAGS} \
            --quiet

      # Optional extension point:
      # - For GKE, swap the last step with `kubectl set image` / `helm upgrade`,
      #   using the same WIF auth (plus `gcloud container clusters get-credentials`).
