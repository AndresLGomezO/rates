name: Deploy (main → production)

on:
  push:
    branches: ["main"]
    paths:
      - "apps/**"
      - "packages/**"
      - "Dockerfile*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy.yml"

concurrency:
  # Serializes production deployments; latest push wins.
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Required for GitHub → GCP OIDC federation (NO long-lived secrets).
  id-token: write

env:
  # --- Change these per environment / repo ---
  GCP_PROJECT_ID: your-prod-project-id
  GCP_REGION: us-central1

  # Artifact Registry repository (regional). Create once per env.
  AR_REPOSITORY: rates

  # Cloud Run services (one per deployable workspace).
  CLOUD_RUN_SERVICE_APP: rates-app
  CLOUD_RUN_SERVICE_AUTH_APP: rates-auth-app

  # Workload Identity Federation provider resource:
  # projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/${POOL_ID}/providers/${PROVIDER_ID}
  WIF_PROVIDER: projects/123456789012/locations/global/workloadIdentityPools/github-pool/providers/github-provider

  # Service account used by GitHub Actions *in prod* (least privilege).
  # This is NOT the runtime service account for Cloud Run; it’s the deployer identity.
  WIF_SERVICE_ACCOUNT: github-ci-prod@your-prod-project-id.iam.gserviceaccount.com

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      auth_app: ${{ steps.filter.outputs.auth_app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - "apps/app/**"
              - "packages/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "apps/app/Dockerfile"
            auth_app:
              - "apps/auth-app/**"
              - "packages/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "apps/auth-app/Dockerfile"

  deploy:
    name: Build → push → deploy (Cloud Run)
    runs-on: ubuntu-latest
    needs: [changes]
    # GitHub Environment gives you: required reviewers, audit trail, protected secrets (if ever needed).
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: app
            enabled: ${{ needs.changes.outputs.app == 'true' }}
            dockerfile: apps/app/Dockerfile
            image_name: rates-app
            cloud_run_service: ${{ env.CLOUD_RUN_SERVICE_APP }}
          - id: auth-app
            enabled: ${{ needs.changes.outputs.auth_app == 'true' }}
            dockerfile: apps/auth-app/Dockerfile
            image_name: rates-auth-app
            cloud_run_service: ${{ env.CLOUD_RUN_SERVICE_AUTH_APP }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC → WIF)
        if: matrix.enabled
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        if: matrix.enabled
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker auth for Artifact Registry
        if: matrix.enabled
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Setup Docker Buildx
        if: matrix.enabled
        uses: docker/setup-buildx-action@v3

      - name: Build & push image (tag = github.sha)
        if: matrix.enabled
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ matrix.image_name }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        if: matrix.enabled
        run: |
          gcloud run deploy "${{ matrix.cloud_run_service }}" \
            --region "${{ env.GCP_REGION }}" \
            --image "${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ matrix.image_name }}:${{ github.sha }}" \
            --platform managed \
            --quiet

      # Optional extension point:
      # - For GKE, swap the last step with `kubectl set image` / `helm upgrade`,
      #   using the same WIF auth (plus `gcloud container clusters get-credentials`).
