name: CI (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Monorepo-aware: only run if relevant paths changed.
    # (CI still runs if workflow files change, so we validate pipeline edits too.)
    paths:
      - "apps/**"
      - "packages/**"
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/**"

concurrency:
  # Avoid wasting CI minutes on superseded PR updates.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # No cloud auth in CI; keep permissions minimal.
  contents: read

jobs:
  changes:
    name: Detect changed workspaces
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      auth_app: ${{ steps.filter.outputs.auth_app }}
      firebase_client: ${{ steps.filter.outputs.firebase_client }}
      ui_theme: ${{ steps.filter.outputs.ui_theme }}
      ai_processor: ${{ steps.filter.outputs.ai_processor }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Path-based change detection so we only build what’s affected.
      - name: Path filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - "apps/app/**"
              - "packages/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
            auth_app:
              - "apps/auth-app/**"
              - "packages/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
            firebase_client:
              - "packages/firebase-client/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
            ui_theme:
              - "packages/ui-theme/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
            any:
              - "apps/**"
              - "packages/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
            ai_processor:
              - "apps/ai-processor/**"
              - "packages/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"

  validate:
    name: Lint / format / type-check
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.any == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies (workspace)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      # This repo currently doesn't define tests; keep the pipeline ready for when they appear.
      - name: Test (if present)
        run: pnpm -r --if-present test

  build:
    name: Build (affected apps only)
    runs-on: ubuntu-latest
    needs: [changes, validate]
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.auth_app == 'true' || needs.changes.outputs.ai_processor == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: app
            enabled: ${{ needs.changes.outputs.app == 'true' }}
          - workspace: auth-app
            enabled: ${{ needs.changes.outputs.auth_app == 'true' }}
          - workspace: ai-processor
            enabled: ${{ needs.changes.outputs.ai_processor == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies (workspace)
        run: pnpm install --frozen-lockfile

      - name: Build ${{ matrix.workspace }}
        if: matrix.enabled
        run: pnpm --filter ${{ matrix.workspace }} build