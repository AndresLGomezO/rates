# ============================================================================
# CLOUD BUILD - PROD ENVIRONMENT DEPLOYMENT
# ============================================================================
# Source of Truth: docs/IMPLEMENTATION_PLAN.md (Phase 5)
#                  docs/COST_GUARDRAILS.md (Build Limits)
#
# ⚠️  PRODUCTION DEPLOYMENT - Requires manual approval
#
# Trigger: Push to main branch
# Environment: prod
# Approval: REQUIRED
#
# Build Steps:
#   1. Build auth-app API container (production optimized)
#   2. Push to Artifact Registry
#   3. Deploy to Cloud Run
#   4. Build and deploy Firebase Hosting (main-app, auth-app client)
#
# Cost Guardrails:
#   - Timeout: 10 minutes (600s) per COST_GUARDRAILS.md
#   - Machine type: Default (e2-medium equivalent)
#
# Security:
#   - Production-optimized builds
#   - No development dependencies
#   - Semantic versioning recommended for images
# ============================================================================

substitutions:
  _REGION: us-central1
  _ENVIRONMENT: prod
  _ARTIFACT_REGISTRY: us-central1-docker.pkg.dev/${PROJECT_ID}/rates-prod-containers
  _CLOUD_RUN_SERVICE: rates-prod-api-us-central1

options:
  logging: CLOUD_LOGGING_ONLY
  # Timeout: 10 minutes max per COST_GUARDRAILS.md
  # This is set at the build level, individual steps can be shorter

timeout: 600s

steps:
  # ============================================================================
  # STEP 1: Install Dependencies (Production)
  # ============================================================================
  - name: 'node:20-alpine'
    id: 'install-dependencies'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "Installing pnpm..."
        npm install -g pnpm@9
        echo "Installing dependencies (production)..."
        pnpm install --frozen-lockfile --prod=false
    waitFor: ['-']

  # ============================================================================
  # STEP 2: Run Tests (Required for Production)
  # ============================================================================
  - name: 'node:20-alpine'
    id: 'run-tests'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm install -g pnpm@9
        echo "Running tests (required for production)..."
        pnpm test
    waitFor: ['install-dependencies']

  # ============================================================================
  # STEP 3: Build Auth App API Container (Production)
  # ============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-api-image'
    args:
      - 'build'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/api:${SHORT_SHA}'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/api:${TAG_NAME:-latest}'
      - '-f'
      - 'apps/auth-app/Dockerfile'
      - '--build-arg'
      - 'NODE_ENV=production'
      - '.'
    waitFor: ['run-tests']

  # ============================================================================
  # STEP 4: Push Container to Artifact Registry
  # ============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-api-image'
    args:
      - 'push'
      - '--all-tags'
      - '${_ARTIFACT_REGISTRY}/api'
    waitFor: ['build-api-image']

  # ============================================================================
  # STEP 5: Deploy to Cloud Run (Production)
  # ============================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_CLOUD_RUN_SERVICE}'
      - '--image'
      - '${_ARTIFACT_REGISTRY}/api:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--no-traffic'  # Deploy without routing traffic (gradual rollout)
      - '--quiet'
    waitFor: ['push-api-image']

  # ============================================================================
  # STEP 6: Build Main App (Firebase Hosting - Production)
  # ============================================================================
  - name: 'node:20-alpine'
    id: 'build-main-app'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm install -g pnpm@9
        echo "Building main app for production..."
        pnpm --filter=app build
    env:
      - 'NODE_ENV=production'
      - 'VITE_ENVIRONMENT=${_ENVIRONMENT}'
    waitFor: ['install-dependencies']

  # ============================================================================
  # STEP 7: Build Auth App Client (Firebase Hosting - Production)
  # ============================================================================
  - name: 'node:20-alpine'
    id: 'build-auth-app-client'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm install -g pnpm@9
        echo "Building auth app client for production..."
        pnpm --filter=auth-app build:client
    env:
      - 'NODE_ENV=production'
      - 'VITE_ENVIRONMENT=${_ENVIRONMENT}'
    waitFor: ['install-dependencies']

  # ============================================================================
  # STEP 8: Deploy to Firebase Hosting (Production)
  # ============================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-firebase-hosting'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Installing Firebase CLI..."
        npm install -g firebase-tools
        
        echo "Deploying to Firebase Hosting (production)..."
        firebase deploy --only hosting:rates-${_ENVIRONMENT}-main-app,hosting:rates-${_ENVIRONMENT}-auth-app \
          --project=${PROJECT_ID} \
          --non-interactive
    waitFor: ['build-main-app', 'build-auth-app-client']

  # ============================================================================
  # STEP 9: Route Traffic to New Revision
  # ============================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'route-traffic'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Routing 100% traffic to new revision..."
        gcloud run services update-traffic ${_CLOUD_RUN_SERVICE} \
          --region=${_REGION} \
          --to-latest \
          --quiet
    waitFor: ['deploy-cloud-run', 'deploy-firebase-hosting']

  # ============================================================================
  # STEP 10: Deployment Verification
  # ============================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'verify-deployment'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "============================================"
        echo "⚠️  PRODUCTION DEPLOYMENT COMPLETE"
        echo "============================================"
        echo ""
        echo "Cloud Run Service: ${_CLOUD_RUN_SERVICE}"
        
        # Get Cloud Run URL
        CLOUD_RUN_URL=$(gcloud run services describe ${_CLOUD_RUN_SERVICE} \
          --region=${_REGION} \
          --format='value(status.url)')
        
        echo "Cloud Run URL: $CLOUD_RUN_URL"
        echo ""
        echo "Testing health endpoint..."
        curl -s "$CLOUD_RUN_URL/health" || echo "Health check pending..."
        echo ""
        echo "Image: ${_ARTIFACT_REGISTRY}/api:${SHORT_SHA}"
        echo "Tag: ${TAG_NAME:-latest}"
        echo ""
        echo "============================================"
        echo "VERIFY END-TO-END FUNCTIONALITY"
        echo "============================================"
    waitFor: ['route-traffic']

# Images to be pushed (for build history)
images:
  - '${_ARTIFACT_REGISTRY}/api:${SHORT_SHA}'
  - '${_ARTIFACT_REGISTRY}/api:${TAG_NAME:-latest}'