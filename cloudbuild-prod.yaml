# ============================================================================
# CLOUD BUILD - PROD ENVIRONMENT DEPLOYMENT
# ============================================================================
# Source of Truth: docs/IMPLEMENTATION_PLAN.md (Phase 5)
#                  docs/COST_GUARDRAILS.md (Build Limits)
#
# ⚠️  PRODUCTION DEPLOYMENT - Requires manual approval
#
# Trigger: Push to main branch
# Environment: prod
# Approval: REQUIRED
#
# Build Steps:
#   1. Build auth-app API container (production optimized)
#   2. Build AI Service and AI Processor containers
#   3. Push to Artifact Registry
#   4. Deploy to Cloud Run (API, AI Service, AI Processor Job)
#   5. Build and deploy Firebase Hosting (main-app, auth-app client)
#
# Cost Guardrails:
#   - Timeout: 15 minutes (900s)
#   - Machine type: Default (e2-medium equivalent)
#
# Security:
#   - Production-optimized builds
#   - No development dependencies
#   - Semantic versioning recommended for images
# ============================================================================

substitutions:
  _REGION: us-central1
  _ENVIRONMENT: prod
  _ARTIFACT_REGISTRY: us-central1-docker.pkg.dev/${PROJECT_ID}/rates-prod-containers
  _CLOUD_RUN_SERVICE: rates-prod-api-us-central1
  _CLOUD_RUN_SERVICE_AI: rates-prod-ai-service-us-central1
  _CLOUD_RUN_JOB_AI: rates-prod-ai-processor

options:
  logging: CLOUD_LOGGING_ONLY
  # Timeout: 15 minutes max

timeout: 900s

steps:
  # ============================================================================
  # STEP 1: Install Dependencies (Production)
  # ============================================================================
  - name: 'node:20-alpine'
    id: 'install-dependencies'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "Installing pnpm..."
        npm install -g pnpm@9
        echo "Installing dependencies (production)..."
        pnpm install --frozen-lockfile --prod=false
    waitFor: ['-']

  # ============================================================================
  # STEP 2: Run Tests (Required for Production)
  # ============================================================================
  - name: 'node:20-alpine'
    id: 'run-tests'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm install -g pnpm@9
        echo "Running tests (required for production)..."
        pnpm test
    waitFor: ['install-dependencies']

  # ============================================================================
  # STEP 3: Build Auth App API Container (Production)
  # ============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-api-image'
    args:
      - 'build'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/api:${SHORT_SHA}'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/api:${TAG_NAME:-latest}'
      - '-f'
      - 'apps/auth-app/Dockerfile'
      - '--build-arg'
      - 'NODE_ENV=production'
      - '.'
    waitFor: ['run-tests']

  # ============================================================================
  # STEP 3a: Build AI Service Container (Production)
  # ============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-ai-service-image'
    args:
      - 'build'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/ai-service:${SHORT_SHA}'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/ai-service:${TAG_NAME:-latest}'
      - '-f'
      - 'apps/ai-service/Dockerfile'
      - '--build-arg'
      - 'NODE_ENV=production'
      - '.'
    waitFor: ['run-tests']

  # ============================================================================
  # STEP 3b: Build AI Processor Container (Production)
  # ============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-ai-processor-image'
    args:
      - 'build'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/ai-processor:${SHORT_SHA}'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/ai-processor:${TAG_NAME:-latest}'
      - '-f'
      - 'apps/ai-processor/Dockerfile'
      - '--build-arg'
      - 'NODE_ENV=production'
      - '.'
    waitFor: ['run-tests']

  # ============================================================================
  # STEP 4: Push Containers to Artifact Registry
  # ============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-images'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        docker push --all-tags ${_ARTIFACT_REGISTRY}/api
        docker push --all-tags ${_ARTIFACT_REGISTRY}/ai-service
        docker push --all-tags ${_ARTIFACT_REGISTRY}/ai-processor
    waitFor: ['build-api-image', 'build-ai-service-image', 'build-ai-processor-image']

  # ============================================================================
  # STEP 5: Deploy API and AI Service to Cloud Run (Production)
  # ============================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-services'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Deploying Api (no-traffic)..."
        gcloud run deploy ${_CLOUD_RUN_SERVICE} --image ${_ARTIFACT_REGISTRY}/api:${SHORT_SHA} --region ${_REGION} --platform managed --no-traffic --quiet
        echo "Deploying AI Service (no-traffic)..."
        gcloud run deploy ${_CLOUD_RUN_SERVICE_AI} --image ${_ARTIFACT_REGISTRY}/ai-service:${SHORT_SHA} --region ${_REGION} --platform managed --no-traffic --quiet
        echo "Updating AI Processor Job..."
        gcloud run jobs deploy ${_CLOUD_RUN_JOB_AI} --image ${_ARTIFACT_REGISTRY}/ai-processor:${SHORT_SHA} --region ${_REGION} --quiet
    waitFor: ['push-images']

  # ============================================================================
  # STEP 6: Build Main App (Firebase Hosting - Production)
  # ============================================================================
  - name: 'node:20-alpine'
    id: 'build-main-app'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm install -g pnpm@9
        echo "Building main app for production..."
        pnpm --filter=app build
    env:
      - 'NODE_ENV=production'
      - 'VITE_ENVIRONMENT=${_ENVIRONMENT}'
    waitFor: ['install-dependencies']

  # ============================================================================
  # STEP 7: Build Auth App Client (Firebase Hosting - Production)
  # ============================================================================
  - name: 'node:20-alpine'
    id: 'build-auth-app-client'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm install -g pnpm@9
        echo "Building auth app client for production..."
        pnpm --filter=auth-app build:client
    env:
      - 'NODE_ENV=production'
      - 'VITE_ENVIRONMENT=${_ENVIRONMENT}'
    waitFor: ['install-dependencies']

  # ============================================================================
  # STEP 8: Deploy to Firebase Hosting (Production)
  # ============================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-firebase-hosting'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g firebase-tools
        firebase deploy --only hosting:rates-${_ENVIRONMENT}-main-app,hosting:rates-${_ENVIRONMENT}-auth-app --project=${PROJECT_ID} --non-interactive
    waitFor: ['build-main-app', 'build-auth-app-client']

  # ============================================================================
  # STEP 9: Route Traffic to New Revisions
  # ============================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'route-traffic'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Routing 100% traffic to new revisions..."
        gcloud run services update-traffic ${_CLOUD_RUN_SERVICE} --region=${_REGION} --to-latest --quiet
        gcloud run services update-traffic ${_CLOUD_RUN_SERVICE_AI} --region=${_REGION} --to-latest --quiet
    waitFor: ['deploy-services', 'deploy-firebase-hosting']

  # ============================================================================
  # STEP 10: Deployment Verification
  # ============================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'verify-deployment'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "============================================"
        echo "⚠️  PRODUCTION DEPLOYMENT COMPLETE"
        echo "============================================"
        echo "Services:"
        echo "  API: ${_CLOUD_RUN_SERVICE}"
        echo "  AI: ${_CLOUD_RUN_SERVICE_AI}"
        echo "  Processor (Job): ${_CLOUD_RUN_JOB_AI}"
        echo "============================================"
    waitFor: ['route-traffic']

# Images to be pushed (for build history)
images:
  - '${_ARTIFACT_REGISTRY}/api:${SHORT_SHA}'
  - '${_ARTIFACT_REGISTRY}/api:${TAG_NAME:-latest}'
  - '${_ARTIFACT_REGISTRY}/ai-service:${SHORT_SHA}'
  - '${_ARTIFACT_REGISTRY}/ai-service:${TAG_NAME:-latest}'
  - '${_ARTIFACT_REGISTRY}/ai-processor:${SHORT_SHA}'
  - '${_ARTIFACT_REGISTRY}/ai-processor:${TAG_NAME:-latest}'