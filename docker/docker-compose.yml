services:
  firebase-emulators:
    build:
      context: ..
      dockerfile: docker/Dockerfile.firebase-emulators
    container_name: rates-firebase-emulators
    ports:
      # Firebase Emulator UI
      - "4000:4000"
      # Auth Emulator
      - "9099:9099"
      # Firestore Emulator
      - "8080:8080"
      # Storage Emulator
      - "9199:9199"
      # Functions Emulator
      - "5001:5001"
    volumes:
      # Persist emulator data
      - firebase-emulator-data:/app/.firebase/emulators
      # Mount Firebase config (for hot-reload of rules/indexes)
      # Mount as individual files to match Dockerfile structure
      - ../firebase/firebase.json:/app/firebase.json:ro
      - ../firebase/firestore.rules:/app/firestore.rules:ro
      - ../firebase/firestore.indexes.json:/app/firestore.indexes.json:ro
      - ../firebase/storage.rules:/app/storage.rules:ro
    # Optional: uncomment to use .env.docker file from project root
    # env_file:
    #   - ../.env.docker
    environment:
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-default}
    networks:
      - rates-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:4000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  firebase-emulator-data:
    driver: local

networks:
  rates-network:
    driver: bridge
