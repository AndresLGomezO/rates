# ============================================================================
# CLOUD BUILD - DEV ENVIRONMENT DEPLOYMENT
# ============================================================================
# Source of Truth: docs/IMPLEMENTATION_PLAN.md (Phase 5)
#                  docs/COST_GUARDRAILS.md (Build Limits)
#
# Trigger: Push to develop branch
# Environment: dev
# Approval: Not required
#
# Build Steps:
#   1. Build auth-app API container
#   2. Build AI Service and AI Processor containers
#   3. Push to Artifact Registry
#   4. Deploy to Cloud Run (API, AI Service, AI Processor Job)
#   5. Build and deploy Firebase Hosting (main-app, auth-app client)
#
# Cost Guardrails:
#   - Timeout: 15 minutes (900s) - Increased to accommodate more builds
#   - Machine type: Default (e2-medium equivalent)
# ============================================================================

substitutions:
  _REGION: us-central1
  _ENVIRONMENT: dev
  _ARTIFACT_REGISTRY: us-central1-docker.pkg.dev/${PROJECT_ID}/rates-dev-containers
  _CLOUD_RUN_SERVICE: rates-dev-api-us-central1
  _CLOUD_RUN_SERVICE_APP: rates-dev-app-us-central1
  _CLOUD_RUN_SERVICE_AI: rates-dev-ai-service-us-central1
  _CLOUD_RUN_JOB_AI: rates-dev-ai-processor
  # Firebase Web App Configuration (required for frontend builds)
  # These should be set when creating the Cloud Build trigger
  # Get values from Firebase Console > Project Settings > Your apps > Web app config
  _FIREBASE_API_KEY: ""  # Set this when creating the trigger
  _FIREBASE_PROJECT_ID: "${PROJECT_ID}"  # Defaults to GCP project ID
  _FIREBASE_AUTH_DOMAIN: "${PROJECT_ID}.firebaseapp.com"  # Defaults based on project
  _FIREBASE_STORAGE_BUCKET: "${PROJECT_ID}.appspot.com"  # Defaults based on project
  _FIREBASE_MESSAGING_SENDER_ID: ""  # Set this when creating the trigger
  _FIREBASE_APP_ID: ""  # Set this when creating the trigger
  _FIREBASE_MEASUREMENT_ID: ""  # Optional, set if using Analytics

options:
  logging: CLOUD_LOGGING_ONLY
  # Timeout: 15 minutes max (increased for additional apps)

timeout: 900s

steps:
  # ============================================================================
  # STEP 1: Install Dependencies
  # ============================================================================
  - name: 'node:20-alpine'
    id: 'install-dependencies'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "Installing pnpm..."
        npm install -g pnpm@9
        echo "Installing dependencies..."
        pnpm install --frozen-lockfile
    waitFor: ['-']

  # ============================================================================
  # STEP 2: Run Tests (Optional but Recommended)
  # ============================================================================
  - name: 'node:20-alpine'
    id: 'run-tests'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm install -g pnpm@9
        echo "Running tests..."
        pnpm test || echo "No tests configured or tests passed"
    waitFor: ['install-dependencies']

  # ============================================================================
  # STEP 3: Build Auth App API Container
  # ============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-api-image'
    args:
      - 'build'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/api:${SHORT_SHA}'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/api:latest'
      - '-f'
      - 'apps/auth-app/Dockerfile'
      - '--build-arg'
      - 'NODE_ENV=development'
      - '.'
    waitFor: ['run-tests']

  # ============================================================================
  # STEP 3a: Build AI Service Container
  # ============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-ai-service-image'
    args:
      - 'build'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/ai-service:${SHORT_SHA}'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/ai-service:latest'
      - '-f'
      - 'apps/ai-service/Dockerfile'
      - '--build-arg'
      - 'NODE_ENV=development'
      - '.'
    waitFor: ['run-tests']

  # ============================================================================
  # STEP 3b: Build AI Processor Container
  # ============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-ai-processor-image'
    args:
      - 'build'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/ai-processor:${SHORT_SHA}'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/ai-processor:latest'
      - '-f'
      - 'apps/ai-processor/Dockerfile'
      - '--build-arg'
      - 'NODE_ENV=development'
      - '.'
    waitFor: ['run-tests']

  # ============================================================================
  # STEP 4: Push Containers to Artifact Registry
  # ============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-images'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        docker push --all-tags ${_ARTIFACT_REGISTRY}/api
        docker push --all-tags ${_ARTIFACT_REGISTRY}/ai-service
        docker push --all-tags ${_ARTIFACT_REGISTRY}/ai-processor
    waitFor: ['build-api-image', 'build-ai-service-image', 'build-ai-processor-image']

  # ============================================================================
  # STEP 5a: Retrieve and Validate Firebase Configuration
  # ============================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'get-firebase-config'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Retrieving Firebase Web App Configuration"
        SECRET_NAME="rates-${_ENVIRONMENT}-firebase-web-config"
        FIREBASE_CONFIG=$(gcloud secrets versions access latest --secret="${SECRET_NAME}" --project="${PROJECT_ID}" 2>/dev/null || echo "")
        
        if [ -n "$FIREBASE_CONFIG" ] && echo "$FIREBASE_CONFIG" | grep -q "apiKey"; then
          if command -v jq &> /dev/null; then
            FIREBASE_API_KEY=$(echo "$FIREBASE_CONFIG" | jq -r '.apiKey // ""' 2>/dev/null || echo "")
            FIREBASE_PROJECT_ID=$(echo "$FIREBASE_CONFIG" | jq -r '.projectId // ""' 2>/dev/null || echo "${PROJECT_ID}")
            FIREBASE_AUTH_DOMAIN=$(echo "$FIREBASE_CONFIG" | jq -r '.authDomain // ""' 2>/dev/null || echo "${PROJECT_ID}.firebaseapp.com")
            FIREBASE_STORAGE_BUCKET=$(echo "$FIREBASE_CONFIG" | jq -r '.storageBucket // ""' 2>/dev/null || echo "${PROJECT_ID}.appspot.com")
            FIREBASE_MESSAGING_SENDER_ID=$(echo "$FIREBASE_CONFIG" | jq -r '.messagingSenderId // ""' 2>/dev/null || echo "")
            FIREBASE_APP_ID=$(echo "$FIREBASE_CONFIG" | jq -r '.appId // ""' 2>/dev/null || echo "")
            FIREBASE_MEASUREMENT_ID=$(echo "$FIREBASE_CONFIG" | jq -r '.measurementId // ""' 2>/dev/null || echo "")
          else
            FIREBASE_API_KEY=$(echo "$FIREBASE_CONFIG" | grep -o '"apiKey"[[:space:]]*:[[:space:]]*"[^"]*"' | sed 's/.*"apiKey"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/' || echo "")
            FIREBASE_PROJECT_ID=$(echo "$FIREBASE_CONFIG" | grep -o '"projectId"[[:space:]]*:[[:space:]]*"[^"]*"' | sed 's/.*"projectId"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/' || echo "${PROJECT_ID}")
            FIREBASE_AUTH_DOMAIN=$(echo "$FIREBASE_CONFIG" | grep -o '"authDomain"[[:space:]]*:[[:space:]]*"[^"]*"' | sed 's/.*"authDomain"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/' || echo "${PROJECT_ID}.firebaseapp.com")
            FIREBASE_STORAGE_BUCKET=$(echo "$FIREBASE_CONFIG" | grep -o '"storageBucket"[[:space:]]*:[[:space:]]*"[^"]*"' | sed 's/.*"storageBucket"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/' || echo "${PROJECT_ID}.appspot.com")
            FIREBASE_MESSAGING_SENDER_ID=$(echo "$FIREBASE_CONFIG" | grep -o '"messagingSenderId"[[:space:]]*:[[:space:]]*"[^"]*"' | sed 's/.*"messagingSenderId"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/' || echo "")
            FIREBASE_APP_ID=$(echo "$FIREBASE_CONFIG" | grep -o '"appId"[[:space:]]*:[[:space:]]*"[^"]*"' | sed 's/.*"appId"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/' || echo "")
            FIREBASE_MEASUREMENT_ID=$(echo "$FIREBASE_CONFIG" | grep -o '"measurementId"[[:space:]]*:[[:space:]]*"[^"]*"' | sed 's/.*"measurementId"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/' || echo "")
          fi
        fi
        
        cat > /workspace/.firebase-env <<EOF
export VITE_FIREBASE_API_KEY="${FIREBASE_API_KEY}"
export VITE_FIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID}"
export VITE_FIREBASE_AUTH_DOMAIN="${FIREBASE_AUTH_DOMAIN}"
export VITE_FIREBASE_STORAGE_BUCKET="${FIREBASE_STORAGE_BUCKET}"
export VITE_FIREBASE_MESSAGING_SENDER_ID="${FIREBASE_MESSAGING_SENDER_ID}"
export VITE_FIREBASE_APP_ID="${FIREBASE_APP_ID}"
export VITE_FIREBASE_MEASUREMENT_ID="${FIREBASE_MEASUREMENT_ID}"
export VITE_FIREBASE_MODE=live
export VITE_USE_FIREBASE_EMULATOR=false
EOF
    waitFor: ['install-dependencies']

  # ============================================================================
  # STEP 5b: Build App Static Files
  # ============================================================================
  - name: 'node:20-alpine'
    id: 'build-app-static'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm install -g pnpm@9
        [ -f /workspace/.firebase-env ] && . /workspace/.firebase-env
        pnpm --filter=app build
    env:
      - 'NODE_ENV=development'
      - 'VITE_ENVIRONMENT=${_ENVIRONMENT}'
    waitFor: ['get-firebase-config']

  # ============================================================================
  # STEP 6: Build App Container (nginx static server)
  # ============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-app-image'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cat > /workspace/Dockerfile.app <<'EOF'
        FROM nginx:alpine
        COPY apps/app/dist /usr/share/nginx/html
        RUN echo 'server { \
            listen 8080; \
            server_name _; \
            root /usr/share/nginx/html; \
            index index.html; \
            location / { \
                try_files $$uri $$uri/ /index.html; \
            } \
            location /health { \
                access_log off; \
                return 200 "healthy\n"; \
                add_header Content-Type text/plain; \
            } \
        }' > /etc/nginx/conf.d/default.conf
        EXPOSE 8080
        CMD ["sh", "-c", "sed -i \"s/listen.*80/listen 8080/\" /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"]
        EOF
        docker build -t ${_ARTIFACT_REGISTRY}/app:${SHORT_SHA} -t ${_ARTIFACT_REGISTRY}/app:latest -f /workspace/Dockerfile.app /workspace
    waitFor: ['build-app-static']

  # ============================================================================
  # STEP 7: Push App Image to Artifact Registry
  # ============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-app-image'
    args:
      - 'push'
      - '--all-tags'
      - '${_ARTIFACT_REGISTRY}/app'
    waitFor: ['build-app-image']

  # ============================================================================
  # STEP 8: Deploy All Services to Cloud Run
  # ============================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-services'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Deploying Api..."
        gcloud run deploy ${_CLOUD_RUN_SERVICE} --image ${_ARTIFACT_REGISTRY}/api:${SHORT_SHA} --region ${_REGION} --platform managed --quiet
        echo "Deploying App..."
        gcloud run deploy ${_CLOUD_RUN_SERVICE_APP} --image ${_ARTIFACT_REGISTRY}/app:${SHORT_SHA} --region ${_REGION} --platform managed --quiet
        echo "Deploying AI Service..."
        gcloud run deploy ${_CLOUD_RUN_SERVICE_AI} --image ${_ARTIFACT_REGISTRY}/ai-service:${SHORT_SHA} --region ${_REGION} --platform managed --quiet
        echo "Updating AI Processor Job..."
        gcloud run jobs deploy ${_CLOUD_RUN_JOB_AI} --image ${_ARTIFACT_REGISTRY}/ai-processor:${SHORT_SHA} --region ${_REGION} --quiet
    waitFor: ['push-images', 'push-app-image']

  # ============================================================================
  # STEP 9: Build and Deploy Firebase Hosting (Optional)
  # ============================================================================
  - name: 'node:20-alpine'
    id: 'build-extra-hosting'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm install -g pnpm@9
        [ -f /workspace/.firebase-env ] && . /workspace/.firebase-env
        echo "Building auth app client..."
        pnpm --filter=auth-app build:client
    waitFor: ['get-firebase-config']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-firebase-hosting'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g firebase-tools
        firebase deploy --only hosting:rates-${_ENVIRONMENT}-main-app,hosting:rates-${_ENVIRONMENT}-auth-app --project=${PROJECT_ID} --non-interactive
    waitFor: ['build-extra-hosting', 'build-app-static']

  # ============================================================================
  # STEP 10: Deployment Verification
  # ============================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'verify-deployment'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "============================================"
        echo "DEV DEPLOYMENT COMPLETE"
        echo "============================================"
        echo "Services:"
        echo "  API: ${_CLOUD_RUN_SERVICE}"
        echo "  App: ${_CLOUD_RUN_SERVICE_APP}"
        echo "  AI: ${_CLOUD_RUN_SERVICE_AI}"
        echo "  Processor (Job): ${_CLOUD_RUN_JOB_AI}"
        echo "============================================"
    waitFor: ['deploy-services', 'deploy-firebase-hosting']

# Images to be pushed (for build history)
images:
  - '${_ARTIFACT_REGISTRY}/api:${SHORT_SHA}'
  - '${_ARTIFACT_REGISTRY}/api:latest'
  - '${_ARTIFACT_REGISTRY}/app:${SHORT_SHA}'
  - '${_ARTIFACT_REGISTRY}/app:latest'
  - '${_ARTIFACT_REGISTRY}/ai-service:${SHORT_SHA}'
  - '${_ARTIFACT_REGISTRY}/ai-service:latest'
  - '${_ARTIFACT_REGISTRY}/ai-processor:${SHORT_SHA}'
  - '${_ARTIFACT_REGISTRY}/ai-processor:latest'