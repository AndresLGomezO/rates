# ============================================================================
# CLOUD BUILD - DEV ENVIRONMENT DEPLOYMENT
# ============================================================================
# Source of Truth: docs/IMPLEMENTATION_PLAN.md (Phase 5)
#                  docs/COST_GUARDRAILS.md (Build Limits)
#
# Trigger: Push to develop branch
# Environment: dev
# Approval: Not required
#
# Build Steps:
#   1. Build auth-app API container
#   2. Push to Artifact Registry
#   3. Deploy to Cloud Run
#   4. Build and deploy Firebase Hosting (main-app, auth-app client)
#
# Cost Guardrails:
#   - Timeout: 10 minutes (600s) per COST_GUARDRAILS.md
#   - Machine type: Default (e2-medium equivalent)
# ============================================================================

substitutions:
  _REGION: us-central1
  _ENVIRONMENT: dev
  _ARTIFACT_REGISTRY: us-central1-docker.pkg.dev/${PROJECT_ID}/rates-dev-containers
  _CLOUD_RUN_SERVICE: rates-dev-api-us-central1

options:
  logging: CLOUD_LOGGING_ONLY
  # Timeout: 10 minutes max per COST_GUARDRAILS.md
  # This is set at the build level, individual steps can be shorter

timeout: 600s

steps:
  # ============================================================================
  # STEP 1: Install Dependencies
  # ============================================================================
  - name: 'node:20-alpine'
    id: 'install-dependencies'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "Installing pnpm..."
        npm install -g pnpm@9
        echo "Installing dependencies..."
        pnpm install --frozen-lockfile
    waitFor: ['-']

  # ============================================================================
  # STEP 2: Run Tests (Optional but Recommended)
  # ============================================================================
  - name: 'node:20-alpine'
    id: 'run-tests'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm install -g pnpm@9
        echo "Running tests..."
        pnpm test || echo "No tests configured or tests passed"
    waitFor: ['install-dependencies']

  # ============================================================================
  # STEP 3: Build Auth App API Container
  # ============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-api-image'
    args:
      - 'build'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/api:${SHORT_SHA}'
      - '-t'
      - '${_ARTIFACT_REGISTRY}/api:latest'
      - '-f'
      - 'apps/auth-app/Dockerfile'
      - '--build-arg'
      - 'NODE_ENV=development'
      - '.'
    waitFor: ['run-tests']

  # ============================================================================
  # STEP 4: Push Container to Artifact Registry
  # ============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-api-image'
    args:
      - 'push'
      - '--all-tags'
      - '${_ARTIFACT_REGISTRY}/api'
    waitFor: ['build-api-image']

  # ============================================================================
  # STEP 5: Deploy to Cloud Run
  # ============================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_CLOUD_RUN_SERVICE}'
      - '--image'
      - '${_ARTIFACT_REGISTRY}/api:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--quiet'
    waitFor: ['push-api-image']

  # ============================================================================
  # STEP 6: Build Main App (Firebase Hosting)
  # ============================================================================
  - name: 'node:20-alpine'
    id: 'build-main-app'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm install -g pnpm@9
        echo "Building main app for ${_ENVIRONMENT}..."
        pnpm --filter=app build
    env:
      - 'NODE_ENV=development'
      - 'VITE_ENVIRONMENT=${_ENVIRONMENT}'
    waitFor: ['install-dependencies']

  # ============================================================================
  # STEP 7: Build Auth App Client (Firebase Hosting)
  # ============================================================================
  - name: 'node:20-alpine'
    id: 'build-auth-app-client'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        npm install -g pnpm@9
        echo "Building auth app client for ${_ENVIRONMENT}..."
        pnpm --filter=auth-app build:client
    env:
      - 'NODE_ENV=development'
      - 'VITE_ENVIRONMENT=${_ENVIRONMENT}'
    waitFor: ['install-dependencies']

  # ============================================================================
  # STEP 8: Deploy to Firebase Hosting
  # ============================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-firebase-hosting'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Installing Firebase CLI..."
        npm install -g firebase-tools
        
        echo "Deploying to Firebase Hosting (${_ENVIRONMENT})..."
        firebase deploy --only hosting:rates-${_ENVIRONMENT}-main-app,hosting:rates-${_ENVIRONMENT}-auth-app \
          --project=${PROJECT_ID} \
          --non-interactive
    waitFor: ['build-main-app', 'build-auth-app-client']

  # ============================================================================
  # STEP 9: Deployment Verification
  # ============================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'verify-deployment'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "============================================"
        echo "DEV DEPLOYMENT COMPLETE"
        echo "============================================"
        echo ""
        echo "Cloud Run Service: ${_CLOUD_RUN_SERVICE}"
        
        # Get Cloud Run URL
        CLOUD_RUN_URL=$(gcloud run services describe ${_CLOUD_RUN_SERVICE} \
          --region=${_REGION} \
          --format='value(status.url)')
        
        echo "Cloud Run URL: $CLOUD_RUN_URL"
        echo ""
        echo "Testing health endpoint..."
        curl -s "$CLOUD_RUN_URL/health" || echo "Health check pending..."
        echo ""
        echo "============================================"
    waitFor: ['deploy-cloud-run', 'deploy-firebase-hosting']

# Images to be pushed (for build history)
images:
  - '${_ARTIFACT_REGISTRY}/api:${SHORT_SHA}'
  - '${_ARTIFACT_REGISTRY}/api:latest'